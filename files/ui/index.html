<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>NusaShell Files</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="files-shell">
    <header class="files-topbar">
      <div class="files-brand" aria-label="NusaShell Files">
        <span class="files-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><strong>Files</strong><span>Workspace explorer</span></div>
      </div>

      <form class="files-search" id="search-form" role="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="search-input" type="search" maxlength="500" placeholder="Search this workspace" aria-label="Search files">
        <kbd>⌘ K</kbd>
      </form>

      <div class="topbar-actions">
        <button class="icon-button" id="upload-button" type="button" aria-label="Upload files from this computer" title="Upload files">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"></path></svg>
        </button>
        <input class="sr-only" id="upload-input" type="file" multiple>
        <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh directory" title="Refresh directory">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6v5h-5"></path><path d="M19 11a7 7 0 1 0 1 5"></path></svg>
        </button>
        <button class="icon-button" id="up-button" type="button" aria-label="Go to parent directory" title="Go to parent directory">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
        </button>
        <button class="primary-button" id="new-file-button" type="button"><span aria-hidden="true">＋</span> New file</button>
      </div>
    </header>

    <main class="files-workspace" id="files-workspace">
      <aside class="sidebar-tree" aria-label="Directory tree">
        <div class="sidebar-heading"><span>Workspace</span><button class="icon-button small" id="collapse-tree-button" type="button" aria-label="Collapse all folders" title="Collapse all folders"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 15 5-5 5 5"></path></svg></button></div>
        <button class="root-node" id="root-button" type="button"><span class="root-node-icon" aria-hidden="true">⌂</span><span id="root-caption">Home</span></button>
        <nav class="tree-container" id="tree-container" aria-label="Directory tree navigation"><p class="tree-empty">Loading folders…</p></nav>
        <div class="sidebar-foot"><span class="status-dot" aria-hidden="true"></span><span>Connected to local workspace</span></div>
      </aside>

      <section class="files-main" aria-label="File listing">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Current path"></nav>
        <div class="listing-toolbar">
          <div><h1 id="folder-title">Home</h1><span class="listing-count" id="listing-count">Loading…</span></div>
          <div class="listing-actions">
            <button class="secondary-button" id="new-folder-button" type="button"><span aria-hidden="true">＋</span> New folder</button>
            <span class="selection-actions" id="selection-actions" hidden>
              <button class="secondary-button" id="rename-button" type="button">Rename</button>
              <button class="danger-button" id="delete-button" type="button">Delete</button>
            </span>
          </div>
        </div>
        <div class="listing-columns" aria-hidden="true"><span>Name</span><span>Size</span><span>Modified</span><span></span></div>
        <div class="listing-body" id="listing-body" role="list"><p class="listing-empty">Loading…</p></div>
      </section>

      <section class="preview-pane" id="preview-pane" aria-label="Details and preview" hidden>
        <div class="preview-header"><span class="eyebrow">Details</span><button class="icon-button" id="close-preview-button" type="button" aria-label="Close details"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
        <div class="preview-file"><span class="preview-file-icon" id="preview-icon" aria-hidden="true"></span><div><strong id="preview-title">—</strong><span id="preview-subtitle">—</span></div></div>
        <div class="preview-meta" id="preview-meta"></div>
        <div class="preview-content" id="preview-content"></div>
      </section>
    </main>

    <div class="modal-overlay" id="modal-overlay" hidden>
      <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header"><div><strong id="modal-title">—</strong><span id="modal-description"></span></div><button class="icon-button" id="modal-close-button" type="button" aria-label="Close dialog"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></header>
        <form class="modal-form" id="modal-form">
          <label class="form-field" id="modal-name-field"><span id="modal-field-label">Name</span><input id="modal-input" type="text" autocomplete="off" required></label>
          <label class="form-field" id="modal-content-field" hidden><span>Initial content <em>(optional)</em></span><textarea id="modal-textarea" rows="9" placeholder="Start writing…"></textarea></label>
          <p class="confirm-copy" id="confirm-copy" hidden></p>
          <span class="form-error" id="modal-error" role="alert"></span>
          <div class="modal-actions"><button class="secondary-button" id="modal-cancel-button" type="button">Cancel</button><button class="primary-button" id="modal-save-button" type="submit">Save</button></div>
        </form>
      </section>
    </div>
    <div class="files-drop-overlay" id="files-drop-overlay" hidden aria-hidden="true">
      <span class="files-drop-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M12 3v11m0 0-4-4m4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <strong class="files-drop-label" data-drop-label>Drop to upload</strong>
      <span class="files-drop-hint">Files land in the current folder</span>
    </div>
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </div>
  <script src="./app.js" type="module"></script>
</body>
</html>
