<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NusaShell — Telegram</title>
  <link rel="stylesheet" href="./index.css" />
  <script>
    (function () {
      var raw = localStorage.getItem('nusashell-telegram-theme') || 'default:system';
      var parts = raw.split(':');
      var mode = parts.length === 2 ? parts[1] : raw;
      if (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">✈</span>
        <div class="brand-copy">
          <span class="brand-text">NusaShell</span>
          <span class="brand-sub">Telegram</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#/status" data-page="status" class="nav-item" title="Status">
          <span class="nav-icon">●</span><span class="nav-label">Status</span>
        </a>
        <a href="#/chats" data-page="chats" class="nav-item" title="Chats">
          <span class="nav-icon">💬</span><span class="nav-label">Chats</span>
        </a>
        <a href="#/approvals" data-page="approvals" class="nav-item" title="Approvals">
          <span class="nav-icon">☑</span><span class="nav-label">Approvals</span>
          <span class="nav-badge" id="approvalBadge" style="display:none"></span>
        </a>
        <a href="#/settings" data-page="settings" class="nav-item" title="Settings">
          <span class="nav-icon">⚙</span><span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="conn-chip" id="connChip" title="Connection state">
          <span class="conn-dot" id="connDot"></span>
          <span class="conn-label" id="connLabel">—</span>
        </div>
        <span class="sidebar-meta">v0.3.0</span>
      </div>
    </aside>

    <main id="content" aria-live="polite">
      <!-- Pages rendered by JS -->
    </main>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div id="confirm-dialog" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title">
    <div class="modal-card">
      <h2 id="confirm-dialog-title" class="modal-title"></h2>
      <p id="confirm-dialog-message" class="modal-message"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="handleConfirmCancel()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-dialog-ok" onclick="handleConfirmOk()">Confirm</button>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
