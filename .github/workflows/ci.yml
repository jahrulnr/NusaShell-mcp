name: Test and build plugins

on:
  pull_request:
  push:
    branches:
      - master
      - v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GO_VERSION: "1.26"
  KNOWN_PLUGINS: "files kanban notes terminal"

jobs:
  detect:
    name: Detect changed plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed plugins
        id: detect
        run: |
          set -euo pipefail
          KNOWN="$KNOWN_PLUGINS"
          CHANGED=""
          FILES=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="$KNOWN"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || echo "")
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              FILES=$(git diff --name-only "$BEFORE..$AFTER" 2>/dev/null || echo "")
            else
              FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$CHANGED" ] && [ -n "$FILES" ]; then
            for p in $KNOWN; do
              if echo "$FILES" | grep -qE "^${p}/"; then
                CHANGED="$CHANGED $p"
              fi
            done
          fi

          CHANGED=$(echo $CHANGED | xargs)

          if [ -z "$CHANGED" ]; then
            echo "plugins=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No plugin changes detected."
          else
            MATRIX=$(echo "$CHANGED" | tr ' ' '\n' | jq -R . | jq -cs .)
            echo "plugins=$MATRIX" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changed plugins: $CHANGED"
          fi

  test:
    name: ${{ matrix.plugin }} (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mcpkit/go.sum
            ${{ matrix.plugin }}/mcp/go.sum

      - name: Build
        working-directory: ${{ matrix.plugin }}/mcp
        run: |
          go build -o server .
          go vet ./...

      - name: Test
        working-directory: ${{ matrix.plugin }}/mcp
        run: go test ./...

  release:
    name: Release ${{ matrix.plugin }}
    needs: [detect, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mcpkit/go.sum
            ${{ matrix.plugin }}/mcp/go.sum

      - name: Read version from manifest
        id: version
        working-directory: ${{ matrix.plugin }}
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          TAG="${{ matrix.plugin }}-v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Plugin: ${{ matrix.plugin }}, version: $VERSION, tag: $TAG"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version in ${{ matrix.plugin }}/manifest.json before merging."
            exit 1
          fi

      - name: Build server
        working-directory: ${{ matrix.plugin }}/mcp
        run: go build -o server .

      - name: Create distribution tarball
        run: |
          tar czf "${{ matrix.plugin }}-${{ steps.version.outputs.version }}.tar.gz" \
            --exclude='tests' \
            --exclude='*.test.*' \
            --exclude='ui-src' \
            --exclude='db' \
            --exclude='shared' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            -C "${{ matrix.plugin }}" .

      - name: Create tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ matrix.plugin }}-${{ steps.version.outputs.version }}.tar.gz" \
            --title "${{ matrix.plugin }} v${{ steps.version.outputs.version }}" \
            --notes "Built from commit ${{ github.sha }}" \
            --target master

  publish-versions:
    name: Update versions.json
    needs: [detect, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Update versions.json
        env:
          PLUGINS: ${{ needs.detect.outputs.plugins }}
        run: |
          set -euo pipefail
          git pull --rebase origin master 2>/dev/null || true
          echo "$PLUGINS" | jq -r '.[]' | while read plugin; do
            VERSION=$(jq -r '.version' "${plugin}/manifest.json")
            TAG="${plugin}-v${VERSION}"
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq --arg plugin "$plugin" --arg version "$VERSION" --arg tag "$TAG" --arg ts "$TIMESTAMP" \
              '.[$plugin] = {version: $version, tag: $tag, releasedAt: $ts}' \
              versions.json > versions.json.tmp && mv versions.json.tmp versions.json
            echo "Updated $plugin → $VERSION (tag: $TAG)"
          done
          if git diff --quiet versions.json; then
            echo "versions.json unchanged — already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "chore: update versions.json [skip ci]"
            git push
            echo "versions.json updated and pushed."
          fi
