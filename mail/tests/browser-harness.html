<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail UI browser harness</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body>
  <script src="./browser-fixture.js"></script>
  <script>
    fetch("../ui/index.html")
      .then((response) => response.text())
      .then((html) => {
        const body = /<body>([\s\S]*)<\/body>/.exec(html)?.[1] ?? "";
        const withoutScript = body.replace(/<script[\s\S]*?<\/script>/g, "");
        document.body.insertAdjacentHTML("afterbegin", withoutScript);
        const script = document.createElement("script");
        script.type = "module";
        script.src = "../ui/app.js";
        document.body.append(script);
      });
  </script>
</body>
</html>
